[package]
name = "typox"
version = "1.1.0"
description = "AI-powered grammar and spelling correction app"
authors = ["rotyro"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name collision with the bin crate on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "typox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
enigo = "0.6"
arboard = "3"
keyring = "4.2.0"
whatlang = "0.18"

[dev-dependencies]
wiremock = "0.6.5"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
